site_name: GAMBIT
site_author: Theiagen Genomics
site_description: Genomic Approximation Method for Bacterial Identification and Tracking Documentation
site_url: https://gambit-suite.github.io/gambit

repo_url: https://github.com/gambit-suite/gambit-docs

nav:
  - GAMBIT: 
     - Home: index.md
     - Getting Started:
        - With the Command-Line: getting_started/commandline.md
        - With Terra.bio: getting_started/terra.md
     - Databases:
        - Overview: databases/overview.md
        - GAMBIT Prokaryotic Database: databases/gambit_prokaryotic.md
        - GAMBIT Fungal Database: databases/gambit_fungal.md
        - Creating a GAMBIT Database: databases/creating_database.md
     - FAQ: faq.md

theme: 
  name: material
  logo: assets/logos/Theiagen-Logo-White.png
  favicon: assets/logos/Theiagen-Symbol-Standard-01.png
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    #- navigation.expand
    - navigation.instant
    #- navigation.instant.preview
    - navigation.path
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
    #- toc.integrate
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: light 
      toggle:
        icon: material/weather-night
        name: Switch to Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      accent: indigo
      primary: black
      toggle:
        icon: material/white-balance-sunny
        name: Switch to Light Mode

markdown_extensions: 
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.blocks.html
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - git-revision-date-localized:
      enable_creation_date: true
      type: iso_date
  - search
  - glightbox
  # - section-index

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js  
  - javascripts/tablesort.js 
  - javascripts/table-search.js                                     

extra_css:
  - stylesheets/extra.css                                         

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/theiagen
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/theiagen.bsky.social
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/theiagen
  homepage: https://www.theiagen.com

copyright: |
  &copy; 2022-2025 <a href="https://www.theiagen.com" target="_blank" rel="noopener">Theiagen Genomics</a>